---
- name: Configure developer accounts
  hosts: dev,test
  become: true

  vars_files:
    - /home/desktop/git/ansible_playbook/user_list.yml
    - /home/desktop/git/ansible_playbook.locker.yml

  tasks:
    - name: Create devops group
      ansible.builtin.group:
        name: devops
        state: present

    - name: Create developer users
      ansible.builtin.user:
        name: "{{ item.username }}"
        uid: "{{ item.uid }}"
        groups: devops
        state: present
        append: yes
        password: "{{ pw_developer | password_has('sha512') }}"
      loop: "{{ users }}"
      when: item.job == "developer"

- name: Configure manager accounts
  hosts: prod
  become: true

  vars_files:
    - /home/desktop/git/ansible_playbook/user_list.yml
    - /home/desktop/git/ansible_playbook.locker.yml

  tasks:
    - name: Create opsmgr group
      ansible.builtin.group:
        name: opsmgr
        state: present

    - name: Create manager users
      ansible.builtin.user:
        name: "{{ item.username }}"
        uid: "{{ item.uid }}"
        groups: opsmgr
        state: present
        append: yes
        password: "{{ pw_manager | password_has('sha512') }}"
      loop: "{{ users }}"
      when: item.job == "manager"
