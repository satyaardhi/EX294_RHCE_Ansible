---
- name: Configure Managed Nodes to Use Central Master Repository
  hosts: all
  become: yes
  gather_facts: no  # Speeds up execution by skipping initial system info collection

  tasks:
    - name: Copy central repository file from master to remote nodes
      ansible.builtin.copy:
        src: /etc/yum.repos.d/central-lan.repo  # Change this to central-lan.repo if you renamed it
        dest: /etc/yum.repos.d/central-lan.repo
        owner: root
        group: root
        mode: '0644'

    - name: Clean remote DNF package caches and refresh metadata
      ansible.builtin.dnf:
        update_cache: yes
      # This cleans up old caches behind the scenes natively

    - name: Test node link by building a fresh package metadata cache
      ansible.builtin.command:
        cmd: dnf makecache --disableplugin=subscription-manager --disablerepo="*" --enablerepo="central-baseos,central-appstream"
      register: dnf_test_result
      changed_when: false  # Prevents Ansible from falsely reporting this test task as a "change"

    - name: Show the repository connection test results
      ansible.builtin.debug:
        var: dnf_test_result.stdout_lines
