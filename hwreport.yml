---
- name: Generating hwreport file
  hosts: all
  become: true

  tasks:

    - name: Download the file
      ansible.builtin.get_url:
        url: http://192.168.10.254/ex407/hwreport.empty
        dest: /root/hwreport.txt

    - name: Replace the content of hwreport.txt
      ansible.builtin.replace:
        regexp: "{{ item.src }}"
        replace: "{{ item.dest }}"
        path: /root/hwreport.txt
      loop:
        - src: "hostname"
          dest: "{{ inventory_hostname }}"

        - src: "biosversion"
          dest: "{{ ansible_facts['bios_version'] | default('NONE') }}"

        - src: "memory"
          dest: "{{ ansible_facts['memtotal_mb'] | string | default('NONE') }}"

        - src: "vdasize"
          dest: >-
            {{
            ansible_facts['devices']['vda']['size']
            if 'vda' in ansible_facts['devices']
            else 'NONE'
            }}

        - src: "vdbsize"
          dest: >-
            {{
            ansible_facts['devices']['vdb']['size']
            if 'vdb' in ansible_facts['devices']
            else 'NONE'
            }}

        - src: "vdcsize"
          dest: >-
            {{
            ansible_facts['devices']['vdc']['size']
            if 'vdb' in ansible_facts['devices']
            else 'NONE'
            }}
