---
- name: Generating hwreport file
  hosts: all
  become: true

  tasks:
    - name: Download the file
      ansible.builtin.get_url:
        url: http://192.168.10.254/ex407/hwreport.empty
        dest: /root/hwreport.txt
        mode: '0644'
        
    - name: Replace the content of hwreport.txt
      ansible.builtin.replace:
        path: /root/hwreport.txt
        regexp: "{{ item.src }}"
        replace: "{{ item.dest }}"
      loop:
        - src: "hostname"
          # NOTE: The requirement asks for Inventory Host Name, which is inventory_hostname.
          # ansible_facts['hostname'] is the system hostname (which can differ from inventory).
          dest: "{{ inventory_hostname | default('NONE') }}"

        - src: "biosversion"
          dest: "{{ ansible_facts['bios_version'] | default('NONE') }}"

        - src: "memory"
          dest: "{{ ansible_facts['memtotal_mb'] | string | default('NONE') }}"

        - src: "sdasize"
          dest: "{{ ansible_facts['devices']['sda']['size'] if (ansible_facts['devices']['vda'] is defined) else 'NONE' }}"

        - src: "sdbsize"
          dest: "{{ ansible_facts['devices']['sdb']['size'] if (ansible_facts['devices']['vdb'] is defined) else 'NONE' }}"

        - src: "sdcsize"
          dest: "{{ ansible_facts['devices']['sdc']['size'] if (ansible_facts['devices']['vdc'] is defined) else 'NONE' }}"
