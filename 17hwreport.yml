---
- name: Generate hw report
  hosts: all
  become: yes

  tasks:
    - name: Download file
      ansible.builtin.get_url:
        url: http://192.168.10.254/ex407/hwreport.empty
        dest: /root/hwreport.txt
        mode: '0644'

    - name: Replace content in hwreport.txt
      ansible.builtin.replace:
        path: /root/hwreport.txt
        regexp: "{{ item.src }}"
        replace: "{{ item.dest }}"
      loop:
        - src: "hostname"
        - dest: "{{ inventory_hostname | default('NONE') }}"
        - src: "bios_version"
        - dest: "{{ ansible_facts['bios_version'] | default('NONE') }}"
        - src: "memory"
        - dest: "{{ ansible_facts['memtotal_mb'] | string | default('NONE') }}"
        - src: "vdasize"
        - dest: "{{ ansible_facts['devices']['vda']['size'] if (ansible_facts['devices']['vda'] is defined) else 'NONE' }}"
        - src: "vdbsize"
        - dest: "{{ ansible_facts['devices']['vdb']['size'] if (ansible_facts['devices']['vdb'] is defined) else 'NONE' }}"
        - src: "vdcsize"
        - dest: "{{ ansible_facts['devices']['vdc']['size'] if (ansible_facts['devices']['vdc'] is defined) else 'NONE' }}"
